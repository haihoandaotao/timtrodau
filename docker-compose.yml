# DB phát triển (MySQL 8) — đồng nhất mọi máy, thay cho MariaDB đặt tay.
# Dùng: npm run db:up   (hoặc: docker compose up -d --wait)
# Rồi:  npm run db:migrate && npm run db:seed
# Lưu ý: cổng 3306 phải trống — tắt MariaDB/MySQL cục bộ khác trước khi chạy.
services:
  mysql:
    image: mysql:8.0
    container_name: dal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: dau_accommodation
    ports:
      - '3306:3306'
    volumes:
      - dal_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pdevpass']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dal_mysql_data:
